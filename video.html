<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Videosphere</title>
    <meta name="description" content="Videosphere">

    <script src="https://aframe.io/releases/0.6.1/aframe.min.js"></script>

    <style>
        body {
            margin: 0;
        }

        #control {
            position: fixed;
            top: 10%;
            left: 10%;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            color: white;
            background-color: rgba(38, 50, 56, 0.9);
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #546e7a;
        }
    </style>
</head>

<body>

    <div id="control">
        <a href="./index.html">
            <button>Volver</button>
        </a>
    </div>

    <a-scene>
        <a-assets>
            <img id="planeta" src="./recursos/planeta.png">

            <video
                id="video360"
                src="./recursos/video360.mp4"
                autoplay
                muted
                loop
                playsinline
                preload="auto">
            </video>
        </a-assets>

        <a-videosphere
            src="#video360"
            rotation="0 0 0">
        </a-videosphere>

        <a-sphere
            position="-8 1 -2"
            rotation="0 30 45"
            scale="1 1 1"
            src="#planeta"
            animation="property: position; to: -8 1 -3; dir: alternate; dur: 2000; loop: true">

            <a-animation
                attribute="rotation"
                begin="mouseenter"
                dur="300"
                to="360 45 45">
            </a-animation>

        </a-sphere>

        <a-camera>
            <a-cursor color="#ff66ff"></a-cursor>
        </a-camera>
    </a-scene>

</body>
</html>
